<!DOCTYPE html>
<html>
<head>
    <title>form.html</title>
    <link rel="icon" type="image/jpeg" href="riza.imgs.jpeg">
    <style>
       body {
     background-image: url('husen.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    margin:0;
    font-family: Arial, sans-serif;
    color:white;
    padding:30px 20px;
    display:flex;
    justify-content:center;
}
.card {
    background:#2c3444;
    max-width:550px;
    width:100%;
    border-radius:16px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.08);
}
.card h1 { text-align:center; font-size:20px; opacity:0.7; margin-bottom:10px; }
.card h2 { text-align:center; color:#6a8cff; margin-bottom:20px; }
.box {
    background:#151d33;
    padding:25px;
    border-radius:12px;
}
label {
    display:block;
    margin-top:12px;
    margin-bottom:4px;
    font-size:13px;
    color:#aab4d0;
}
input, select, textarea {
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
    background:#1e2f5a;
    color:white;
    font-size:13px;
    box-sizing:border-box;
    outline:none;
}
input:focus, select:focus, textarea:focus {
    border-color:#3b5da1;
    box-shadow:0 0 0 2px rgba(59,93,161,0.3);
}
input[type="radio"], input[type="checkbox"] {
    width:auto;
    margin-right:6px;
}

.btn-kembali {
    display:inline-block;
    margin-top:15px;
    background:transparent;
    border:1px solid #3b5da1;
    color:#6a8cff;
    padding:8px 18px;
    border-radius:20px;
    text-decoration:none;
    font-size:13px;
}
center {
    position: absolute;
    top: 20px;
    right: 20px;
    margin-left: auto; 
}
.btn-kembali:hover {
    background:#3b5da1;
    color:white;
}
    </style>
</head>
<body>


    <div class="box">
        <h3>Formulir Pendaftaran</h3>

        <form>
            <label>Nama Lengkap:</label>
            <input type="text" placeholder="Masukkan nama">

            <label>Email:</label>
            <input type="email" placeholder="nama@email.com">

            <label>Password:</label>
            <input type="password">

            <label>Umur:</label>
            <input type="number" style="width: 60px;">

            <label>Tanggal Lahir:</label>
            <input type="date">

            <label>Jenis Kelamin:</label>
            <div style="display:flex; gap:20px; margin:8px 0 15px 0;">
         <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="radio" name="gender" value="Laki-laki"> Laki-laki  </label>
           <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="radio" name="gender" value="Perempuan"> Perempuan
          </label>
        </div>

            <label>Hobi:</label>
        <div style="display:flex; gap:15px; margin:8px 0;">
          <label><input type="checkbox" name="hobi" value="Coding"> Coding</label>
          <label><input type="checkbox" name="hobi" value="Gaming"> Gaming</label>
          <label><input type="checkbox" name="hobi" value="Olahraga"> Olahraga</label>
        </div>

            <label>Jurusan:</label>
            <select>
                <option>-- Pilih Jurusan --</option>
                <option>Teknik Informatika</option>
                <option>Sistem Informasi</option>
                <option>DKV</option>
            </select>

            <label>Alamat:</label>
            <textarea placeholder="Masukkan alamat"></textarea>

            <label>Foto:</label>
            <input type="file">

            <label>Website:</label>
            <input type="url" placeholder="https://example.com">

            <div class="buttons">
                <button type="submit">Kirim</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

</body>
<center><a href="index.html" class="btn-kembali">← Kembali ke Dashboard</a></center>

</html>
